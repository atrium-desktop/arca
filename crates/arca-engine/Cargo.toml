[package]
name = "arca-engine"
description = "File manager engine and session state machine for Arca: directory model, navigation, file operations, configuration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
arca-xdg = { workspace = true }
# Deliberate exception to the zero-dependency convention: thumbnail decoding
# needs a PNG/JPEG decoder. PNG/JPEG only — no further format features.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { workspace = true }
serde_json = { workspace = true }
