[package]
name = "arca"
description = "Arca — a fast file manager for Wayland, built on the optics stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
arca-engine.workspace = true
arca-ui.workspace = true
iris.workspace = true
# Direct dependency so Cargo publishes `DEP_TRANSIT_RPATHS` to build.rs for
