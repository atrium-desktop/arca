name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The pinned Optics version. Keep this in lockstep with Cargo.toml.
  OPTICS_TAG: v0.0.90

jobs:
  architecture:
    name: Architecture & native-free suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # The CI checkout of Optics must be the same tag the manifest resolves.
      - name: Optics tag matches the workflow pin
        run: |
          pinned=$(sed -n 's/.*tag = "\(v[^"]*\)".*/\1/p' Cargo.toml | sort -u)
          test "$pinned" = "$OPTICS_TAG" || {
            echo "Cargo.toml pins $pinned but OPTICS_TAG is $OPTICS_TAG" >&2
            exit 1
          }

      # The architecture firewalls are Rust tests in the root suite. They are
      # native-free, so a host without the Optics toolchain can still prove the
      # crate boundaries, the zero-dependency layers, and the lockfile graph.
      - name: Architecture firewalls
        run: "cargo test -p arca-tests --no-default-features architecture::"

      - name: Native-free engine, XDG, and protocol suites
        run: cargo test -p arca-tests --no-default-features

  docs:
    name: Code-to-doc synchronisation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CLI flags are documented
        run: python3 scripts/check-docs.py cli

      - name: Config keys are documented
        run: python3 scripts/check-docs.py config

      - name: Keyboard shortcuts are documented
        run: python3 scripts/check-docs.py keys

      - name: Internal doc links resolve
        run: python3 scripts/check-docs.py links

      - name: Test locality
        run: python3 scripts/check-docs.py tests

  test:
    name: Build & test (native)
    runs-on: ubuntu-latest
    env:
      OPTICS_SOURCE_DIR: ${{ github.workspace }}/optics
      OPTICS_BUILD_DIR: ${{ github.workspace }}/optics/build
      # Tests exercise the shared branch (fast, no relink after a C change).
      # The release gate below flips this to 0 and verifies the archives.
      OPTICS_DYNAMIC: "1"
      # bindgen must use the same C23-capable Clang that built Optics.
      LIBCLANG_PATH: /usr/lib/llvm-19/lib
      CLANG_PATH: /usr/bin/clang-19
    steps:
      - uses: actions/checkout@v4

      # The committed Cargo.lock resolves the pinned Optics Git tag. CI checks
      # the same tag out beside the workspace and points the -sys build scripts
      # at its Meson tree; no Cargo [patch] is involved.
      - name: Checkout pinned Optics
        uses: actions/checkout@v4
        with:
          repository: ming2k/optics
          ref: ${{ env.OPTICS_TAG }}
          path: optics
          token: ${{ secrets.OPTICS_READ_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: taiki-e/install-action@nextest

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libvulkan-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libfontconfig-dev libfreetype-dev \
            libharfbuzz-dev libfribidi-dev libdbus-1-dev libglib2.0-dev \
            libsystemd-dev libpng-dev libjpeg-dev meson ninja-build \
            binutils wget gnupg lsb-release software-properties-common
          # Optics v0.0.86 requires a C23 compiler with #embed (Clang >= 19).
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y --no-install-recommends clang-19 libclang-19-dev

      - name: Build pinned Optics C stack
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          meson setup optics/build optics \
            -Dtests=false \
            -Dexamples=false \
            -Dbuildtype=release \
            -Ddefault_library=both
          meson compile -C optics/build

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rustdoc
        run: cargo doc --locked --workspace --no-deps

      - name: Tests (nextest, process-per-test)
        run: cargo nextest run --locked --workspace --profile ci

      - name: Doctests
        run: cargo test --locked --doc --workspace

      # [INV-BUILD-01] The workspace enables Optics's `static` feature by
      # default. Verify the produced ELF before and after stripping debug info.
      - name: Release Optics link mode
        env:
          OPTICS_DYNAMIC: "0"
        run: |
          cargo build --locked --release -p arca
          scripts/check-optics-link.sh --expect static target/release/arca
          strip --strip-debug target/release/arca
          scripts/check-optics-link.sh --expect static target/release/arca
          mkdir -p /tmp/link-gate
          cp target/release/arca /tmp/link-gate/arca

      # The shared branch is a supported configuration and needs its own gate:
      # without this a regression in the rpath relay or pkg-config probe would
      # only surface in a downstream shared deployment.
      - name: Shared Optics link mode
        run: |
          cargo build --locked --release -p arca
          scripts/check-optics-link.sh --expect dynamic target/release/arca

      - name: Link-gate self-test
        run: scripts/test-check-optics-link.sh /tmp/link-gate/arca

      # Named invariants from docs/dev/subsystems.md. They run in this job so
      # they share the exact native environment the other tests use.
      - name: INV-ARCH-01..03 architecture firewalls
        run: "cargo test --locked -p arca-tests --no-default-features architecture::"

      - name: INV-UI-01 frame arena budget
        run: "cargo test --locked -p arca-tests virtualization::"

      - name: INV-UI-04 interaction latency
        run: "cargo test --locked -p arca-tests interaction_stress::"

      - name: INV-OPS-01 trash roundtrip
        run: |
          cargo test --locked -p arca-xdg trash::
          cargo test --locked -p arca-tests --no-default-features file_operations::trash

      - name: INV-OPS-02 anti-clobber
        run: "cargo test --locked -p arca-engine ops::tests"
