# Local-only source patches for cross-repository development.
#
# Enable this file only in a linked Arca worktree:
#   cp .cargo/optics-local.toml .cargo/config.toml
#   git config core.hooksPath .githooks
#
# The generated .cargo/config.toml is ignored by Git. Cargo resolves a local
# lockfile in that worktree; the repository hook keeps the local lockfile out
# of commits. Remove the generated file before promoting an Optics release.
#
# Optics v0.0.80 keeps the per-module binding trees in one Cargo workspace
# rooted at the repository root (Optics ADR-0163), with every crate under
# bindings/crates/. `aperture` is the new application shell (Optics ADR-0166).
# `transit` remains pure Safe Rust and has no `transit-sys` crate (Optics
# ADR-0158); there is no native motion library to patch or rpath.
[patch."https://github.com/ming2k/optics"]
aperture = { path = "../optics/bindings/crates/aperture" }
aperture-sys = { path = "../optics/bindings/crates/aperture-sys" }
flux = { path = "../optics/bindings/crates/flux" }
flux-sys = { path = "../optics/bindings/crates/flux-sys" }
lens = { path = "../optics/bindings/crates/lens" }
lens-sys = { path = "../optics/bindings/crates/lens-sys" }
iris = { path = "../optics/bindings/crates/iris" }
iris-sys = { path = "../optics/bindings/crates/iris-sys" }
transit = { path = "../optics/bindings/crates/transit" }
