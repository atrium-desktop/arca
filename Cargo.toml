[workspace]
resolver = "2"
members = [
    "crates/arca-xdg",
    "crates/arca-engine",
    "crates/arca-ui",
    "crates/arca",
]

[workspace.package]
version = "0.2.5"
edition = "2021"
# The effective toolchain floor is raised by the optics bindings (edition
# 2024, rust 1.85), which compile from source in every dependency mode.
rust-version = "1.85"

[workspace.dependencies]
# Optics stack (flux/lens/iris) official Rust bindings. The canonical build
# resolves the binding sources from the tagged optics monorepo and links the
# C libraries discovered by pkg-config. A linked development worktree can
# patch these sources to a sibling checkout through .cargo/optics-local.toml
# without making that checkout mandatory for CI or downstream packagers; see
# docs/dev/optics-dev-worktree.md.
iris = { git = "https://github.com/ming2k/optics", tag = "v0.0.41" }
lens = { git = "https://github.com/ming2k/optics", tag = "v0.0.41" }
lens-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.41" }
flux = { git = "https://github.com/ming2k/optics", tag = "v0.0.41" }
flux-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.41" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arca-xdg = { path = "crates/arca-xdg", version = "0.2.5" }
arca-engine = { path = "crates/arca-engine", version = "0.2.5" }
arca-ui = { path = "crates/arca-ui", version = "0.2.5" }

[profile.release]
opt-level = 3
lto = "thin"
